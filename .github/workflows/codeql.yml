name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-published queries reach an idle repo too.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended carries the injection and path-traversal queries
          # that matter most for a tool whose whole job is running shell
          # commands on the user's machine.
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
