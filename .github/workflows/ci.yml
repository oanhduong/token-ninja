name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same PR/branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck

  docs:
    name: doc counts in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Fails when README/CLAUDE.md/CONTRIBUTING.md still claim an old rule or
      # test count. Fix with: npm run rule-stats:sync
      - run: npm run rule-stats:check

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Blocking: these are the packages installed on a user's machine
      # alongside a tool that runs shell commands, so a compromised
      # transitive dependency is about as bad as it gets.
      - name: production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      # Reporting only: the outstanding dev advisories are in the vitest
      # chain, and clearing them requires vitest 5, which needs Node
      # >=22.12 and would drop this package's stated Node 20 support. They
      # do not ship to users. Revisit when the Node 20 floor moves.
      - name: dev dependencies (report only)
        run: npm audit --audit-level=high || true

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Advisory until Dependency graph is switched on for this repository
    # (Settings → Code security and analysis; private repos additionally need
    # GitHub Advanced Security). Without it the action cannot run at all and
    # exits with "Dependency review is not supported on this repository",
    # which would block every PR for a reason no diff can fix. The blocking
    # supply-chain gate is the `audit` job above. Drop this line once the
    # setting is on.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Copyleft licences would change the terms this MIT package ships
          # under, so flag them rather than discovering it at release time.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: verify packed artifacts
        run: |
          test -f dist/cli.js
          test -f dist/index.js
          test -f dist/index.d.ts
          test -d dist/rules/builtin
          npm pack --dry-run
      - name: library entry must not execute the CLI
        run: node -e "import('./dist/index.js').then(m => { if (!m.routeOnce) process.exit(1) })"

  build-windows:
    # token-ninja's shims and setup flow are POSIX-only (see README →
    # Platform support), so we do not run the suite here. We do compile and
    # pack, because src/ carries win32 branches that would otherwise only
    # break for users.
    name: build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        os: [ubuntu-latest]
        include:
          - node: 20
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:coverage
        env:
          CI: "true"
      - name: upload coverage
        if: matrix.node == 20 && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # Budgets are scaled by BENCH_FACTOR when CI is set, so this catches
      # algorithmic regressions without failing on runner noise.
      - run: npm run bench
        env:
          CI: "true"
